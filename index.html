<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KONGO CAVE - 2D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #111; color: #fff; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* --- HUD (Barre du haut) --- */
  .hud {
    background: rgba(0,0,0,0.8); padding: 10px 15px; display: flex; justify-content: space-between;
    border-bottom: 1px solid #333; padding-top: max(10px, env(safe-area-inset-top)); z-index: 10;
  }
  .hud-text { font-size: 14px; font-weight: bold; }
  .hud-sub { font-size: 11px; color: #aaa; }

  /* --- LE MONDE 2D (Grille) --- */
  .world-container {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; background: #2a3a20; /* Herbe sombre */
  }
  
  /* On utilise une grille CSS pour dessiner le monde */
  .map-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    width: 100%; height: 100%;
    gap: 1px; background: #1a2514;
  }
  .tile {
    background: #3a5a2a; /* Herbe */
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; position: relative;
  }
  .tile.grass { background: #3a5a2a; }
  .tile.path { background: #5a4a3a; } /* Chemin de terre */
  .tile.house { background: #4a3520; border: 2px solid #7a5a30; font-size: 40px; }
  .tile.cave { background: #1a1a1a; border: 2px solid #444; font-size: 40px; }
  .tile.water { background: #2a4a6a; border: 1px solid #4a8aaa; }

  /* Le joueur */
  .player {
    position: absolute; font-size: 40px; transition: all 0.2s ease;
    z-index: 5; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
  }

  /* --- CONTRÔLES (D-Pad) --- */
  .controls {
    height: 180px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between;
    padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 10;
  }
  .dpad { display: flex; flex-direction: column; align-items: center; width: 150px; }
  .dpad-row { display: flex; }
  .btn-dir {
    width: 50px; height: 50px; background: #333; border: 1px solid #555; color: #fff;
    font-size: 20px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin: 2px;
  }
  .btn-dir:active { background: #555; }
  .action-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 10px; }
  .btn-action {
    background: #d4a44a; color: #000; border: none; padding: 15px 20px; border-radius: 10px;
    font-weight: bold; font-size: 14px; width: 100%; display: none;
  }
  .btn-action.show { display: block; }
  
  /* --- OVERLAY GROTTE --- */
  .cave-view {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20;
  }
  .cave-view.active { display: flex; }
  .cave-title { font-size: 24px; color: #8a9aaa; margin-bottom: 20px; }
</style>
</head>
<body>

<!-- BARRE DU HAUT -->
<div class="hud">
  <div>
    <div class="hud-text" id="clock">06h00</div>
    <div class="hud-sub" id="date">Lundi 1 Janvier</div>
  </div>
  <div style="text-align:right;">
    <div class="hud-text" style="color:#6b8a5a" id="money">5000 FC</div>
    <div class="hud-sub" id="location">Extérieur</div>
  </div>
</div>

<!-- LE MONDE 2D -->
<div class="world-container" id="worldContainer">
  <div class="map-grid" id="mapGrid">
    <!-- La grille sera générée par Javascript -->
  </div>
  <div class="player" id="player">🧑🏾‍🦱</div>
</div>

<!-- VUE DE LA GROTTE -->
<div class="cave-view" id="caveView">
  <div class="cave-title">⛏️ Grotte Sombre</div>
  <p style="color:#666; margin-bottom: 30px;">Il fait noir... Vos provisions baissent.</p>
  <button onclick="exitCave()" style="padding:15px 30px; border-radius:10px; border:none; background:#444; color:#fff; font-size:16px;">Sortir de la grotte</button>
</div>

<!-- CONTRÔLES -->
<div class="controls">
  <div class="dpad">
    <div class="dpad-row"><button class="btn-dir" onclick="move(0, -1)">▲</button></div>
    <div class="dpad-row">
      <button class="btn-dir" onclick="move(-1, 0)">◀</button>
      <button class="btn-dir" onclick="action()">⏺</button>
      <button class="btn-dir" onclick="move(1, 0)">▶</button>
    </div>
    <div class="dpad-row"><button class="btn-dir" onclick="move(0, 1)">▼</button></div>
  </div>
  <div class="action-panel">
    <button class="btn-action" id="actionBtn" onclick="action()">Action</button>
  </div>
</div>

<script>
// Configuration du jeu
const GRID_SIZE = 5;
let playerX = 2, playerY = 2; // Position de départ (centre)
let currentLocation = 'exterior';

// Carte du monde (0: herbe, 1: maison, 2: grotte, 3: eau, 4: chemin)
const worldMap = [
  [0, 0, 0, 0, 0],
  [0, 3, 3, 1, 0],
  [0, 3, 4, 4, 0],
  [0, 0, 4, 2, 0],
  [0, 0, 0, 0, 0]
];

// Initialisation de l'horloge
let totalMinutes = 6 * 60; 
let lastTime = performance.now();

// Création de la grille visuelle
function initMap() {
  const grid = document.getElementById('mapGrid');
  grid.innerHTML = '';
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const type = worldMap[y][x];
      if (type === 0) tile.classList.add('grass');
      if (type === 1) { tile.classList.add('house'); tile.textContent = '🏠'; }
      if (type === 2) { tile.classList.add('cave'); tile.textContent = '🕳️'; }
      if (type === 3) { tile.classList.add('water'); tile.textContent = '🌊'; }
      if (type === 4) { tile.classList.add('path'); }
      grid.appendChild(tile);
    }
  }
  updatePlayerPosition();
}

// Mettre à jour la position visuelle du joueur
function updatePlayerPosition() {
  const player = document.getElementById('player');
  // Calcul de la position en pourcentage (pour s'adapter à l'écran)
  const xPercent = (playerX / GRID_SIZE) * 100 + (100 / GRID_SIZE / 2);
  const yPercent = (playerY / GRID_SIZE) * 100 + (100 / GRID_SIZE / 2);
  
  player.style.left = `${xPercent}%`;
  player.style.top = `${yPercent}%`;
  player.style.transform = 'translate(-50%, -50%)';

  checkTile();
}

// Vérifier sur quelle case on est
function checkTile() {
  const tileType = worldMap[playerY][playerX];
  const actionBtn = document.getElementById('actionBtn');
  
  if (tileType === 1) { // Maison
    actionBtn.textContent = '😴 Dormir / Se reposer';
    actionBtn.classList.add('show');
  } else if (tileType === 2) { // Grotte
    actionBtn.textContent = '⛏️ Entrer dans la grotte';
    actionBtn.classList.add('show');
  } else if (tileType === 3) { // Eau
    actionBtn.textContent = '💧 Boire de l\\'eau';
    actionBtn.classList.add('show');
  } else {
    actionBtn.classList.remove('show');
  }
}

// Déplacement
function move(dx, dy) {
  if (currentLocation === 'cave') return;
  
  const newX = playerX + dx;
  const newY = playerY + dy;

  // Vérifier les limites
  if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
    // Vérifier si c'est de l'eau (infranchissable à pied)
    if (worldMap[newY][newX] === 3) {
      showToast("L'eau est profonde ici.");
      return;
    }
    playerX = newX;
    playerY = newY;
    updatePlayerPosition();
    
    // Faire avancer le temps plus vite quand on marche
    totalMinutes += 5;
    updateTime();
  }
}

// Action (bouton central ou bouton d'action)
function action() {
  const tileType = worldMap[playerY][playerX];
  
  if (tileType === 1) {
    // Dormir
    let d = getDate();
    let delta = 6 * 60 - (d.hour * 60 + d.minute);
    if (delta <= 0) delta += 1440;
    totalMinutes += delta;
    updateTime();
    showToast("☀️ Vous vous réveillez en pleine forme.");
  } 
  else if (tileType === 2) {
    // Entrer dans la grotte
    currentLocation = 'cave';
    document.getElementById('caveView').classList.add('active');
    document.getElementById('location').textContent = 'Dans la grotte';
    document.getElementById('actionBtn').classList.remove('show');
  }
  else if (tileType === 3) {
    showToast("💧 Vous buvez de l'eau fraîche.");
  }
}

function exitCave() {
  currentLocation = 'exterior';
  document.getElementById('caveView').classList.remove('active');
  document.getElementById('location').textContent = 'Extérieur';
  checkTile();
  totalMinutes += 60; // 1h passée dans la grotte
  updateTime();
}

// Mise à jour de l'heure
function updateTime() {
  const d = getDate();
  document.getElementById('clock').textContent = `${String(d.hour).padStart(2,'0')}h${String(d.minute).padStart(2,'0')}`;
  document.getElementById('date').textContent = `${d.weekday} ${d.day} ${d.month}`;
}

function getDate() {
  const days = Math.floor(totalMinutes / 1440);
  const mod = totalMinutes % 1440;
  return {
    hour: Math.floor(mod / 60), minute: mod % 60,
    day: (days % 30) + 1,
    month: ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][Math.floor((days % 360) / 30)],
    weekday: ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][days % 7]
  };
}

// Boucle de temps (le temps s'écoule même sans bouger)
function gameLoop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  if (currentLocation === 'exterior') {
    totalMinutes += dt * 0.5; // 0.5 minute de jeu par seconde
    updateTime();
  }
  requestAnimationFrame(gameLoop);
}

// Message volant
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:20px;color:white;z-index:100;pointer-events:none;transition:opacity 0.5s;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2000);
}

// Démarrer
initMap();
updateTime();
requestAnimationFrame(gameLoop);

// Permettre le déplacement au clavier (pour tester sur PC)
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') move(0, -1);
  if (e.key === 'ArrowDown') move(0, 1);
  if (e.key === 'ArrowLeft') move(-1, 0);
  if (e.key === 'ArrowRight') move(1, 0);
  if (e.key === 'Enter') action();
});
</script>
</body>
</html>
