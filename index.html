<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KONGO CAVE</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #0a0f14; color: #e6e0d4; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  
  /* --- BARRE DU HAUT --- */
  .top-bar {
    background: #131a20; padding: 10px 15px; border-bottom: 1px solid #2a2015;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: max(10px, env(safe-area-inset-top)); z-index: 10;
  }
  .top-info { display: flex; flex-direction: column; }
  #clock { font-size: 18px; font-weight: bold; color: #d4a44a; }
  #date { font-size: 11px; color: #9aacb8; }
  .money { font-size: 14px; color: #6b8a5a; font-weight: bold; text-align: right; }

  /* --- CARTE DU MONDE --- */
  .map-container {
    flex: 1; position: relative; background: #0d141a;
    background-image: radial-gradient(circle at center, #1a2a35 0%, #0a0f14 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .zone {
    width: 120px; height: 120px; border-radius: 50%; border: 2px solid #2f3f4f;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.5); cursor: pointer; transition: 0.2s;
    margin: 15px;
  }
  .zone:active { transform: scale(0.95); }
  .zone.village { border-color: #d4a44a; box-shadow: 0 0 20px rgba(212,164,74,0.2); }
  .zone.cave { border-color: #4a6b8a; box-shadow: 0 0 20px rgba(74,107,138,0.2); }
  .zone.market { border-color: #6b8a5a; box-shadow: 0 0 20px rgba(107,138,90,0.2); }
  .zone span { font-size: 30px; margin-bottom: 5px; }
  .zone label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

  /* --- MESSAGE FLOTTANT --- */
  #toast {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1f2a33; padding: 10px 20px; border-radius: 20px; font-size: 13px;
    border: 1px solid #2f3f4f; opacity: 0; transition: 0.3s; pointer-events: none;
    white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  #toast.show { opacity: 1; bottom: 30px; }

  /* --- MENU DU BAS --- */
  .bottom-nav {
    background: #131a20; display: flex; border-top: 1px solid #2a2015;
    padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 10;
  }
  .nav-btn {
    flex: 1; background: none; border: none; color: #7a8a96; padding: 12px 0;
    font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
  }
  .nav-btn.active { color: #d4a44a; }
  .nav-btn span { font-size: 10px; margin-top: 3px; text-transform: uppercase; }

  /* --- ÉCRAN TÉLÉPHONE (OVERLAY) --- */
  #phoneScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0f14; z-index: 20; display: none; flex-direction: column;
    padding: 15px; padding-top: max(15px, env(safe-area-inset-top));
  }
  .phone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2a2015; padding-bottom: 10px; }
  .phone-header h2 { margin: 0; font-size: 18px; color: #d4a44a; }
  .close-phone { background: none; border: none; color: #e6e0d4; font-size: 24px; cursor: pointer; }
  .phone-content { flex: 1; overflow-y: auto; }
  .card { background: #131a20; border: 1px solid #1f2a33; border-radius: 10px; padding: 15px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a2129; font-size: 14px; }
  .row:last-child { border: none; }

  /* --- CONTRÔLES DE VITESSE --- */
  .time-controls { display: flex; gap: 5px; margin-top: 10px; }
  .time-controls button { flex: 1; background: #1f2a33; color: #e6e0d4; border: 1px solid #2f3f4f; padding: 8px; border-radius: 5px; font-size: 12px; }
  .time-controls button.active { background: #d4a44a; color: #0a0f14; font-weight: bold; }
</style>
</head>
<body>

<!-- BARRE SUPÉRIEURE -->
<div class="top-bar">
  <div class="top-info">
    <span id="clock">06h00</span>
    <span id="date">Lundi 1 Janvier</span>
  </div>
  <div class="money" id="money">5000 FC</div>
</div>

<!-- CARTE DU MONDE -->
<div class="map-container">
  <div class="zone village" onclick="showToast('Vous êtes au village. Vous vous reposez.')">
    <span>🏠</span><label>Village</label>
  </div>
  <div style="display:flex; gap:20px;">
    <div class="zone market" onclick="showToast('Marché : -100 FC. Nourriture achetée.')">
      <span>🛒</span><label>Marché</label>
    </div>
    <div class="zone cave" onclick="startExpedition()">
      <span>⛏️</span><label>Grotte</label>
    </div>
  </div>
  
  <div id="toast">Message</div>
</div>

<!-- MENU INFÉRIEUR -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="togglePhone('none')"><span>🗺️</span>Carte</button>
  <button class="nav-btn" onclick="togglePhone('phone')"><span>📱</span>Téléphone</button>
  <button class="nav-btn" onclick="togglePhone('time')"><span>⏱️</span>Temps</button>
</div>

<!-- ÉCRAN TÉLÉPHONE VIRTUEL -->
<div id="phoneScreen">
  <div class="phone-header">
    <h2 id="phoneTitle">Kongo Phone</h2>
    <button class="close-phone" onclick="togglePhone('none')">✕</button>
  </div>
  <div class="phone-content" id="phoneContent"></div>
</div>

<script>
const T = { MIN_PER_DAY: 1440, DAYS_PER_WEEK: 7, DAYS_PER_MONTH: 30, DAYS_PER_YEAR: 360, MIN_PER_YEAR: 360 * 1440 };
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

class Game {
  constructor() {
    this.totalMinutes = 6 * 60;
    this.speed = 1; this.paused = false; this.acc = 0; this.last = performance.now();
    this.money = 5000;
    this.family = [
      { name: 'Mwamba (vous)', birth: 20 * T.MIN_PER_YEAR },
      { name: 'Nsimba', birth: 18 * T.MIN_PER_YEAR }
    ];
    this.employees = [
      { name: 'Bakala', job: 'Garde', salary: 150, active: true },
      { name: 'Mbuyi', job: 'Mineur', salary: 120, active: true }
    ];
    requestAnimationFrame(this.loop.bind(this));
  }

  loop(now) {
    const dt = (now - this.last) / 1000; this.last = now;
    if (!this.paused) {
      this.acc += dt * 1 * this.speed;
      let safety = 0;
      while (this.acc >= 1 && safety++ < 100) { this.acc -= 1; this.tick(); }
    }
    this.render();
    requestAnimationFrame(this.loop.bind(this));
  }

  tick() {
    this.totalMinutes += 1;
    const d = this.getDate();
    if (d.hour === 17 && d.minute === 1) {
      let total = this.employees.filter(e => e.active).reduce((s,e) => s+e.salary, 0);
      if (total > 0) { this.money -= total; this.showToast(`💰 Paie : -${total} FC`); }
    }
  }

  getDate() {
    const tm = this.totalMinutes;
    const days = Math.floor(tm / T.MIN_PER_DAY);
    const mod = tm % T.MIN_PER_DAY;
    return {
      hour: Math.floor(mod / 60), minute: mod % 60,
      day: (days % T.DAYS_PER_MONTH) + 1,
      month: MONTHS[Math.floor((days % T.DAYS_PER_YEAR) / T.DAYS_PER_MONTH)],
      weekday: DAYS[days % T.DAYS_PER_WEEK],
      year: Math.floor(days / T.DAYS_PER_YEAR) + 1
    };
  }

  render() {
    const d = this.getDate();
    document.getElementById('clock').textContent = `${String(d.hour).padStart(2,'0')}h${String(d.minute).padStart(2,'0')}`;
    document.getElementById('date').textContent = `${d.weekday} ${d.day} ${d.month}, An ${d.year}`;
    document.getElementById('money').textContent = `${this.money} FC`;
    if (document.getElementById('phoneScreen').style.display === 'flex') this.renderPhoneContent();
  }

  renderPhoneContent() {
    const mode = document.getElementById('phoneTitle').dataset.mode;
    const content = document.getElementById('phoneContent');
    
    if (mode === 'phone') {
      content.innerHTML = `
        <div class="card"><h3>👨‍👩‍👧 Famille</h3>
          ${this.family.map(m => {
            const age = Math.floor((this.totalMinutes - m.birth) / T.MIN_PER_YEAR);
            return `<div class="row"><span>${m.name}</span><span>${age} ans</span></div>`;
          }).join('')}
        </div>
        <div class="card"><h3>👷 Employés</h3>
          ${this.employees.map(e => `
            <div class="row">
              <span>${e.name} (${e.job})</span>
              <span style="color:${e.active ? '#6b8a5a' : '#8a4a4a'}">${e.active ? 'Travaille' : 'Parti'}</span>
            </div>
          `).join('')}
        </div>
      `;
    } else if (mode === 'time') {
      content.innerHTML = `
        <div class="card">
          <h3>⏱️ Vitesse du temps</h3>
          <p style="font-size:12px; color:#9aacb8;">Le temps s'écoule même quand vous êtes sur la carte.</p>
          <div class="time-controls">
            <button onclick="game.setSpeed(0)" class="${this.speed===0?'active':''}">Pause</button>
            <button onclick="game.setSpeed(1)" class="${this.speed===1?'active':''}">1×</button>
            <button onclick="game.setSpeed(4)" class="${this.speed===4?'active':''}">4×</button>
            <button onclick="game.setSpeed(12)" class="${this.speed===12?'active':''}">12×</button>
          </div>
        </div>
        <div class="card">
          <h3>😴 Dormir</h3>
          <p style="font-size:12px; color:#9aacb8; margin-bottom:10px;">Accélérer le temps jusqu'au matin (06h00).</p>
          <button onclick="game.sleep()" style="width:100%; padding:10px; background:#2f3f4f; color:white; border:none; border-radius:5px;">Dormir jusqu'au matin</button>
        </div>
      `;
    }
  }

  setSpeed(s) { this.speed = s; this.paused = (s === 0); this.renderPhoneContent(); }
  
  sleep() {
    const d = this.getDate();
    let delta = 6 * 60 - (d.hour * 60 + d.minute);
    if (delta <= 0) delta += 1440;
    this.totalMinutes += delta;
    this.showToast(`☀️ Vous vous réveillez à 06h00.`);
    togglePhone('none');
  }
}

function togglePhone(mode) {
  const screen = document.getElementById('phoneScreen');
  const title = document.getElementById('phoneTitle');
  if (mode === 'none') {
    screen.style.display = 'none';
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i===0));
  } else {
    screen.style.display = 'flex';
    title.dataset.mode = mode;
    title.textContent = mode === 'phone' ? '📱 Téléphone' : '⏱️ Horloge';
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', (mode==='phone' && i===1) || (mode==='time' && i===2)));
    game.renderPhoneContent();
  }
}

let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}

function startExpedition() {
  showToast('⛏️ En route vers la grotte...');
  // Ici, on pourra plus tard lancer la mécanique d'expédition complète
  setTimeout(() => showToast('Vous êtes dans la grotte. Il fait noir...'), 2000);
}

window.onload = () => { window.game = new Game(); };
</script>
</body>
</html>
